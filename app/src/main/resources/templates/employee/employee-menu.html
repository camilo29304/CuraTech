<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="utf-8">

    <title>CuraTech</title>

    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4e73df 0%, #6f42c1 100%);
            --accent-purple: #6f42c1;
            --accent-blue: #4e73df;
        }

        .text-purple {
            color: var(--accent-purple) !important;
        }

        .card-custom {
            border: none;
            border-top: 4px solid var(--accent-purple);
        }

        .calendar-day-header {
            background-color: #f8f9fc;
            border: 1px solid #e3e6f0;
            padding: 0.75rem 0.5rem;
            font-weight: bold;
            color: #4e73df;
        }
    </style>
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <aside th:replace="~{fragments/employee-sidebar :: employeeSidebar}"></aside>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
  
            <div id="content" class="p-4">

                    <h2 class="h3 font-weight-bold text-gray-800 mb-4" th:text="'Bienvenido, ' + ${employee.name}"></h2>

                <!-- Tarjeta Próxima Cita -->
                <div class="card shadow card-custom mb-4" style="max-width: 22rem;" th:if="${appointment != null}">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title m-0 font-weight-bold text-purple">
                            <i class="bi bi-clock-history mr-2"></i>Próxima cita
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="text-gray-700">
                            <p class="mb-1"><i class="bi bi-clock mr-2 text-purple"></i><strong>Hora:</strong> <span th:text="${appointment.formattedTime}">08:30 AM</span></p>
                            <p class="mb-1"><i class="bi bi-tag mr-2 text-purple"></i><strong>Tipo:</strong> <span th:text="${appointment.apptmType.type}">Medicina General</span></p>
                            <p class="mb-1"><i class="bi bi-calendar-event mr-2 text-purple"></i><strong>Día:</strong> <span th:text="${appointment.formattedDate}">15 Sep 2026</span></p>
                            <p class="mb-0"><i class="bi bi-person mr-2 text-purple"></i><strong>Paciente:</strong> <span th:text="${appointment.patient.name} + ' ' + ${appointment.patient.lastName}">Juan Pérez</span></p>
                        </div>
                    </div>
                </div>

                <div th:unless="${appointment != null}" class="col-xl-6 col-md-8 mb-4">
                        <div class="card border-left-info shadow h-100 py-2">
                            <div class="card-body" role="status">
                                <div class="text-xs font-weight-bold text-info text-uppercase mb-1">
                                    Próxima Cita Programada
                                </div>
                                <p class="mb-0 text-gray-800">No tienes citas asignadas.</p>
                            </div>
                        </div>
                </div>

                <!-- Calendario Semanal -->
                <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light text-gray-700">
                                    <tr>
                                        <th class="py-3 pl-4">Lunes</th>
                                        <th class="py-3">Martes</th>
                                        <th class="py-3">Miércoles</th>
                                        <th class="py-3">Jueves</th>
                                        <th class="py-3">Viernes</th>
                                        <th class="py-3">Sábado</th>
                                        <th class="py-3">Domingo</th>
                                    </tr>
                                </thead>
                                <tbody>
                                   <tr th:each="schedule : ${schedules}">
                                        <td th:if="${schedule.date.getDayOfWeek != 'MONDAY'}" th:text="'hora: ' + ${schedule.beginning} + ' - ' + ${schedule.end}"></td>
                                        <td th:if="${schedule.date.getDayOfWeek != 'TUESDAY'}" th:text="'hora: ' + ${schedule.beginning} + ' - ' + ${schedule.end}"></td>
                                        <td th:if="${schedule.date.getDayOfWeek != 'WEDNESDAY'}" th:text="'hora: ' + ${schedule.beginning} + ' - ' + ${schedule.end}"></td>
                                        <td th:if="${schedule.date.getDayOfWeek != 'THURSDAY'}" th:text="'hora: ' + ${schedule.beginning} + ' - ' + ${schedule.end}"></td>
                                        <td th:if="${schedule.date.getDayOfWeek != 'FRIDAY'}" th:text="'hora: ' + ${schedule.beginning} + ' - ' + ${schedule.end}"></td>
                                        <td th:if="${schedule.date.getDayOfWeek != 'SATURDAY'}" th:text="'hora: ' + ${schedule.beginning} + ' - ' + ${schedule.end}"></td>
                                        <td th:if="${schedule.date.getDayOfWeek != 'SUNDAY'}" th:text="'hora: ' + ${schedule.beginning} + ' - ' + ${schedule.end}"></td>
                                   </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

        </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white shadow-sm mt-auto">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto text-gray-600">
                        <span>CuraTech System &copy; 2026</span>
                    </div>
                </div>
            </footer>

        </div>
        <!-- End of Content Wrapper -->

    <!-- End of Page Wrapper -->

</body>

</html>
