<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuraTech - Buscar Empleados</title>

    <!-- Custom fonts -->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4e73df 0%, #6f42c1 100%);
            --accent-purple: #6f42c1;
            --accent-blue: #4e73df;
        }

        .text-purple {
            color: var(--accent-purple) !important;
        }

        .btn-purple {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-purple:hover {
            opacity: 0.9;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(111, 66, 193, 0.3);
        }

        .card-custom {
            border: none;
            border-top: 4px solid var(--accent-purple);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 0.2rem rgba(111, 66, 193, 0.25);
        }

        .avatar-initial {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(111, 66, 193, 0.1);
            color: var(--accent-purple);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body id="page-top">

    <div id="wrapper">
        <!-- Sidebar -->
        <aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content" class="bg-light p-4">

                <!-- Encabezado de la página -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800 font-weight-bold">
                        <i class="bi bi-people-fill text-purple mr-2"></i>Directorio de Empleados
                    </h1>
                    <a th:href="@{/admin/register-employees}" class="btn btn-purple font-weight-bold shadow-sm">
                        <i class="bi bi-person-plus-fill mr-1"></i> Registrar Nuevo
                    </a>
                </div>

                <!-- Card de Filtros de Búsqueda -->
                <div class="card shadow mb-4">
                    <div class="card-body">
                        <form th:action="@{/admin/search-employees}" method="get" class="row align-items-end">
                            <div class="col-md-4 mb-3 mb-md-0">
                                <label class="form-label text-gray-700 font-weight-bold small">Buscar por Documento o Nombre</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-white"><i class="bi bi-search text-purple"></i></span>
                                    </div>
                                    <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Ej. 1032445 o Carlos...">
                                </div>
                            </div>

                            <div class="col-md-3 mb-3 mb-md-0">
                                <label class="form-label text-gray-700 font-weight-bold small">Filtrar por Rol</label>
                                <select class="form-control" name="role">
                                    <option value="">Todos los roles</option>
                                    <option value="ADMINISTRADOR" th:selected="${selectedRole == 'ADMINISTRADOR'}">ADMINISTRADOR</option>
                                    <option value="MEDICO" th:selected="${selectedRole == 'MEDICO'}">MÉDICO</option>
                                    <option value="RECEPCION" th:selected="${selectedRole == 'RECEPCION'}">RECEPCIÓN</option>
                                </select>
                            </div>

                            <div class="col-md-3 mb-3 mb-md-0">
                                <label class="form-label text-gray-700 font-weight-bold small">Estado</label>
                                <select class="form-control" name="status">
                                    <option value="">Todos los estados</option>
                                    <option value="Activo" th:selected="${selectedStatus == 'Activo'}">Activo</option>
                                    <option value="Inactivo" th:selected="${selectedStatus == 'Inactivo'}">Inactivo</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <button type="submit" class="btn btn-purple btn-block font-weight-bold">
                                    <i class="bi bi-funnel-fill mr-1"></i> Filtrar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Tabla de Resultados -->
                <div class="card shadow card-custom mb-4">
                    <div class="card-header py-3 bg-white d-flex justify-content-between align-items-center">
                        <h6 class="m-0 font-weight-bold text-purple">
                            <i class="bi bi-list-ul mr-2"></i>Empleados Encontrados
                        </h6>
                        <span class="badge badge-light text-purple p-2 border font-weight-bold" th:text="'Total: ' + ${employees.size()}">Total: 0</span>
                    </div>

                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light text-gray-700">
                                    <tr>
                                        <th>Empleado</th>
                                        <th>Documento</th>
                                        <th>Cargo / Rol</th>
                                        <th>Contacto</th>
                                        <th>Estado</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:if="${employees.isEmpty()}">
                                        <td colspan="6" class="text-center text-gray-500 py-4">No se encontraron empleados</td>
                                    </tr>
                                    <tr th:each="employee : ${employees}">
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="avatar-initial mr-3" th:text="${#strings.substring(employee.name,0,1) + #strings.substring(employee.lastName,0,1)}">RS</div>
                                                <div>
                                                    <div class="font-weight-bold text-gray-800" th:text="${employee.name + ' ' + employee.lastName}">Nombre</div>
                                                    <div class="small text-gray-500" th:text="${employee.email}">correo</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="align-middle" th:text="${employee.documentNumber}">Documento</td>
                                        <td class="align-middle">
                                            <span class="badge badge-purple bg-light text-purple border p-2" th:text="${employee.role.titleName}">Rol</span>
                                        </td>
                                        <td class="align-middle" th:text="${employee.email}">Contacto</td>
                                        <td class="align-middle">
                                            <span th:classappend="${@adminService.statusEmployee(employee) == 'Activo'} ? 'badge badge-success' : 'badge badge-secondary'"
                                                  th:text="${@adminService.statusEmployee(employee)}">Activo</span>
                                        </td>
                                        <td class="align-middle text-center">
                                            <form th:action="${@adminService.statusEmployee(employee) == 'Activo'} ? @{/admin/employees/{id}/deactivate(id=${employee.id})} : @{/admin/employees/{id}/activate(id=${employee.id})}" method="post" class="d-inline">
                                                <button type="submit" th:classappend="${@adminService.statusEmployee(employee) == 'Activo'} ? 'btn btn-sm btn-light border text-danger' : 'btn btn-sm btn-light border text-success'"
                                                        th:title="${@adminService.statusEmployee(employee) == 'Activo'} ? 'Inactivar' : 'Activar'">
                                                    <i th:classappend="${@adminService.statusEmployee(employee) == 'Activo'} ? 'bi bi-person-x-fill' : 'bi bi-person-check-fill'"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>

                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Paginador -->
                    <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3">
                        <span class="small text-gray-600">Mostrando 1 a 3 de 3 registros</span>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item disabled"><a class="page-link" href="#">Anterior</a></li>
                            <li class="page-item active"><a class="page-link bg-purple-gradient border-0" href="#">1</a></li>
                            <li class="page-item disabled"><a class="page-link" href="#">Siguiente</a></li>
                        </ul>
                    </div>
                </div>

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white shadow-sm mt-auto">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto text-gray-600">
                        <span>CuraTech System &copy; 2026</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

</body>
</html>
